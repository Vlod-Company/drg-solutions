spring:
  application:
    name: "employee-service"
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${PGPORT:5431}/studs
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        bytecode:
          provider: none
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
server:
  port: ${SERVER_PORT:1729}
logging:
  level:
    com:
      netflix:
        eureka: ERROR
        discovery: ERROR
    org:
      springframework:
        web: DEBUG
