
spring:
  application:
    name: "auth-service"
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${PGPORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        bytecode:
          provider: none
    show-sql: true

security:
  pepper: ${AUTH_PEPPER}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
server:
  port: ${SERVER_PORT}
logging:
  level:
    org:
      springframework:
        web: DEBUG