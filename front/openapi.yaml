                  $ref: "#/components/schemas/EmployeeResponseDto"
    post:
      tags: [Employee Service]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequestDto"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponseDto"
  /employee-service/employees/{id}:
    get:
      tags: [Employee Service]
      parameters:
