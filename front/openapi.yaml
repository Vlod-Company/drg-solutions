openapi: 3.0.0
info:
  title: DRG Solutions API
  description: Aggregated API documentation for all services
  version: 1.0.0
servers:
  - url: http://localhost:1381
    description: API Gateway

tags:
  - name: Auth Service
  - name: Delivery Point Service
  - name: Employee Service
  - name: Ecosystem Service
  - name: Glossary Service
  - name: Logistics Service
  - name: Mission Service
  - name: Planet Service
  - name: Request Service
  - name: Spaceship Service
  - name: Station Service
  - name: Store Service
  - name: Team Service

paths:
  # Auth Service
  /auth-service/auth/register:
    post:
      tags: [Auth Service]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth-service/auth/login:
    post:
      tags: [Auth Service]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth-service/auth/validate:
    post:
      tags: [Auth Service]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenInfo"
  /auth-service/auth/me:
    get:
      tags: [Auth Service]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenInfo"
  /auth-service/auth/users/{userId}:
    get:
      tags: [Auth Service]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
  /auth-service/auth/users/{userId}/roles/add:
    post:
      tags: [Auth Service]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
  /auth-service/auth/users/{userId}/roles/remove:
    post:
      tags: [Auth Service]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
