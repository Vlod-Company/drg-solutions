          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                recipientEmployeeId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: OK
