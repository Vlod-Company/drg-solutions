          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
    delete:
      tags: [Team Service]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK

components:
  schemas:
    RegistrationRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        employee_id:
          type: integer
          format: int64
    LoginRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
    ValidateTokenRequest:
      type: object
      properties:
        token:
          type: string
    TokenInfo:
      type: object
      properties:
        username:
          type: string
        user_id:
          type: integer
          format: int64
        employee_id:
          type: integer
          format: int64
        post:
          type: string
        department:
          type: string
        roles:
          type: array
          items:
            type: string
    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        username:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string

    DeliveryPoint:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
    EmployeeResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        post:
          type: string
        department:
          type: string
        experience:
