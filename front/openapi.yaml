  # Mission Service
  /mission-service/mission:
    get:
      tags: [Mission Service]
      parameters:
        - name: pageNumber
          in: query
          required: true
          schema:
            type: integer
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseMissionDto"
    post:
